# Watches the live site: every hour "is it up?", every Monday "any broken link?".
# A problem opens a GitHub issue (e-mailed to the BBF account, it@brassbandfribourg.ch);
# the issue closes by itself once the problem is gone. One issue per problem, no repeats.
# Enabled only when the repository variable SURVEILLANCE is "true" (set it at launch).
name: Surveillance

on:
  schedule:
    - cron: '23 * * * *'  # hourly
    - cron: '41 5 * * 1'  # Mondays, links
  workflow_dispatch:
    inputs:
      controle:
        description: Contrôle à lancer
        type: choice
        options: [disponibilite, liens]
        default: disponibilite

concurrency:
  group: surveillance-${{ github.event.schedule || inputs.controle }}

permissions:
  contents: read
  issues: write

jobs:
  controle:
    if: vars.SURVEILLANCE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://brassbandfribourg.ch/' }}
      MODE: ${{ inputs.controle || (github.event.schedule == '41 5 * * 1' && 'liens') || 'disponibilite' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Contrôle
        id: verif
        continue-on-error: true
        run: node scripts/surveillance.mjs "$MODE" "$SITE_URL"
      - name: Alerte (ouvre ou ferme le ticket)
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTAT: ${{ steps.verif.outcome }}
        run: |
          [ -f rapport.md ] || echo "Le contrôle n'a pas pu s'exécuter : voir le journal de l'action." > rapport.md
          etiquette="surveillance-$MODE"
          if [ "$MODE" = liens ]; then titre="Liens cassés sur le site"; else titre="Site inaccessible"; fi
          gh label create "$etiquette" --color d73a4a --force >/dev/null
          ouvert=$(gh issue list --state open --label "$etiquette" --json number --jq '.[0].number // empty')
          if [ "$RESULTAT" = failure ]; then
            if [ -z "$ouvert" ]; then
              gh issue create --title "$titre" --label "$etiquette" --body-file rapport.md
            elif [ "$MODE" = liens ]; then
              gh issue comment "$ouvert" --body-file rapport.md
            fi
            echo "::error::$titre — voir le ticket"
          elif [ -n "$ouvert" ]; then
            gh issue close "$ouvert" --comment "Résolu automatiquement : $(head -n 1 rapport.md)"
          fi
